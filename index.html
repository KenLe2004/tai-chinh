<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tài chính</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tài chính">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<style>
  :root{--bg:#f7f6f3;--ink:#1f1f1d;--ink2:#6b6a66}
  @media (prefers-color-scheme: dark){:root{--bg:#141413;--ink:#f0efec;--ink2:#b5b4ad}}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);color:var(--ink2);font:14px system-ui,-apple-system,"Segoe UI",Arial,sans-serif;transition:opacity .25s;z-index:2}
  #splash img{width:72px;height:72px;border-radius:18px}
  #splash a{color:var(--ink2);font-size:13px;opacity:0;transition:opacity .3s}
  #splash.slow a{opacity:1}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <span>Đang mở dashboard...</span>
  <a id="direct">Bấm vào đây nếu chưa tự mở</a>
</div>
<script>
  // Link dashboard Apps Script. Link này không chứa dữ liệu; chỉ tài khoản Google của chủ mới xem được dashboard.
  // Google không cho nhúng dashboard vào khung khi chỉ chủ tài khoản được xem, nên app mở thẳng link này.
  var DASH = 'https://script.google.com/macros/s/AKfycbzqmMoACsKCmJ4OlA82o20JJ82MQoThhsnVxHHJs0Fz-JQEYu9ZPwYhyMPpL2bRa8lgVQ/exec';
  document.getElementById('direct').href = DASH;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  setTimeout(function(){ document.getElementById('splash').classList.add('slow'); }, 4000);
  setTimeout(function(){ location.replace(DASH); }, 400);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tài chính</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tài chính">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<style>
  :root{--bg:#f7f6f3;--ink:#1f1f1d;--ink2:#6b6a66}
  @media (prefers-color-scheme: dark){:root{--bg:#141413;--ink:#f0efec;--ink2:#b5b4ad}}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);color:var(--ink2);font:14px system-ui,-apple-system,"Segoe UI",Arial,sans-serif;transition:opacity .25s;z-index:2}
  #splash img{width:72px;height:72px;border-radius:18px}
  #splash a{color:var(--ink2);font-size:13px;opacity:0;transition:opacity .3s}
  #splash.slow a{opacity:1}
  #splash.done{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <span>Đang mở dashboard...</span>
  <a id="direct" target="_self">Lâu quá? Bấm để mở trực tiếp</a>
</div>
<iframe id="app" title="Tài chính" allow="clipboard-write"></iframe>
<script>
  // Link dashboard Apps Script (chỉ tài khoản chủ mở được, link này không chứa dữ liệu)
  var DASH = 'https://script.google.com/macros/s/AKfycbzqmMoACsKCmJ4OlA82o20JJ82MQoThhsnVxHHJs0Fz-JQEYu9ZPwYhyMPpL2bRa8lgVQ/exec';
  var f = document.getElementById('app'), s = document.getElementById('splash');
  document.getElementById('direct').href = DASH;
  var ready = false;
  // Dashboard báo đã tải xong thì mới ẩn màn hình chờ
  window.addEventListener('message', function(e){
    var o = e.origin || ''; if (!(o === 'https://script.google.com' || /\.googleusercontent\.com$/.test(o))) return;
    if (e.data && e.data.type === 'tai-chinh-ready'){ ready = true; s.classList.add('done'); }
  });
  setTimeout(function(){ if (!ready) s.classList.add('slow'); }, 7000);
  // Khung nhúng không mở được (ví dụ chưa đăng nhập Google) thì mở thẳng dashboard
  setTimeout(function(){ if (!ready) location.replace(DASH); }, 15000);
  f.src = DASH;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
